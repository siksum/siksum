<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">DeFiSense current research method</title>
  <desc id="desc">A pipeline from transaction evidence to counterfactual replay and a semantic evidence graph.</desc>
  <rect width="1600" height="900" fill="#11100f"/>
  <style>
    .eyebrow{font:600 22px sans-serif;letter-spacing:4px;fill:#ff7a1a}.title{font:700 52px sans-serif;fill:#f6f2ed}.sub{font:400 24px sans-serif;fill:#b7afa7}.n{font:700 24px sans-serif;fill:#ff7a1a}.h{font:700 27px sans-serif;fill:#f6f2ed}.p{font:400 20px sans-serif;fill:#b7afa7}.small{font:500 18px sans-serif;fill:#d6cec7}.box{fill:#1b1917;stroke:#4b4641;stroke-width:2}.focus{fill:#251a12;stroke:#ff7a1a;stroke-width:3}.line{stroke:#756d66;stroke-width:3;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#756d66"/></marker></defs>
  <text x="80" y="88" class="eyebrow">ONGOING RESEARCH / 2026.09</text>
  <text x="80" y="155" class="title">돈의 이동에서 ‘왜 그 손실이 생겼는가’까지</text>
  <text x="80" y="202" class="sub">소스코드·주소 라벨·LLM 없이, 단일 공격 거래의 피해자와 왜곡값 사용 지점을 실행으로 확인합니다.</text>

  <rect x="80" y="290" width="270" height="230" rx="20" class="box"/>
  <text x="110" y="338" class="n">01</text><text x="110" y="385" class="h">원본 재실행</text>
  <text x="110" y="428" class="p">영수증·로그 일치 확인</text><text x="110" y="463" class="p">읽은 값·쓴 값·자산 이동</text>

  <rect x="410" y="290" width="270" height="230" rx="20" class="box"/>
  <text x="440" y="338" class="n">02</text><text x="440" y="385" class="h">후보 좁히기</text>
  <text x="440" y="428" class="p">공격자가 아닌 주소의 손익</text><text x="440" y="463" class="p">쓴 값 → 뒤에서 읽은 값</text>

  <rect x="740" y="290" width="270" height="230" rx="20" class="focus"/>
  <text x="770" y="338" class="n">03</text><text x="770" y="385" class="h">반사실 재실행</text>
  <text x="770" y="428" class="p">바뀐 값만 거래 전으로</text><text x="770" y="463" class="p">되돌려 지급 감소량 측정</text>

  <rect x="1070" y="290" width="450" height="230" rx="20" class="focus"/>
  <text x="1100" y="338" class="n">04</text><text x="1100" y="385" class="h">의미 증거 그래프</text>
  <text x="1100" y="428" class="p">공격 주체 / 피해자·피해액 / 손익</text><text x="1100" y="463" class="p">왜곡값 사용 지점 / 행동 순서</text>

  <path d="M350 405 H400" class="line"/><path d="M680 405 H730" class="line"/><path d="M1010 405 H1060" class="line"/>

  <rect x="80" y="610" width="700" height="190" rx="18" class="box"/>
  <text x="112" y="659" class="h">지금까지 고정한 것</text>
  <text x="112" y="704" class="small">15개 개발 사례 → 1,031개 typed claim / 정답·추출 기준 검증 15/15</text>
  <text x="112" y="742" class="small">한 거래 공격, 역할·손익·행동·원인 증거를 같은 산출물로 연결</text>

  <rect x="820" y="610" width="700" height="190" rx="18" class="box"/>
  <text x="852" y="659" class="h">아직 증명해야 하는 것</text>
  <text x="852" y="704" class="small">반사실 producer 일반화 / 정상·경계 사례 포함 동결 평가</text>
  <text x="852" y="742" class="small">현재 수치는 성능 우월성이 아니라 개발 검증 범위로만 해석</text>
</svg>
